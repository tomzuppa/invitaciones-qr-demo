<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Invitaciones QR · Demo</title>
<link rel="icon" href="assets/baobyte.png">
<style>
:root{
  --bb:#014a7d; --bb-2:#0b5f9c; --bb-soft:#e7f0f8; --coral:#ee4035;
  --page:#f4f6f9; --card:#ffffff; --ink:#111827; --ink-2:#4b5563; --muted:#6b7280;
  --line:#e5e7eb; --line-2:#d1d5db; --muted-bg:#f3f4f6;
  --good:#0ca30c; --good-ink:#06640b; --good-bg:#e7f6e7;
  --warn:#fab219; --warn-ink:#8a5a00; --warn-bg:#fff4dc;
  --crit:#d03b3b; --crit-bg:#fbe9e9;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;color:var(--ink);background:var(--page);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--bb)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--bb);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.04em}
.muted{color:var(--muted)}

/* ---------- Botones y controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--bb);border-color:var(--bb);color:#fff}
.btn.primary:hover{background:var(--bb-2)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--muted-bg)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--bb);cursor:pointer;font-weight:600;font-size:13px;padding:2px 4px;border-radius:4px}
.link:hover{text-decoration:underline}
input,select,textarea{border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--bb);box-shadow:0 0 0 3px var(--bb-soft)}
label.f{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px;row-gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
label.f > input,label.f > select,label.f > textarea{flex:1 1 100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
h1{font-size:24px;letter-spacing:-.01em}
h2{font-size:15px;margin-bottom:10px}
.help{font-size:13px;color:var(--ink-2)}

/* ---------- Barra superior del panel ---------- */
.topbar{display:flex;align-items:center;gap:22px;background:#fff;border-bottom:1px solid var(--line);padding:10px 24px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:36px;height:36px}
.brand b{display:block;font-size:15px;color:var(--bb)}
.brand span{display:block;font-size:11.5px;color:var(--muted)}
.steps{display:flex;gap:4px;flex:1}
.steps a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:600}
.steps a:hover{background:var(--muted-bg)}
.steps a.on{background:var(--bb-soft);color:var(--bb)}
.steps .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--line);color:var(--ink-2)}
.steps a.on .n{background:var(--bb);color:#fff}
.demo-note{background:#fff8e6;border-bottom:1px solid #f3e1b0;color:#6b4e00;font-size:12.5px;padding:7px 24px;text-align:center}
.wrap{max-width:1240px;margin:0 auto;padding:24px}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.vhead p{color:var(--muted);margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Invitados ---------- */
.hero{padding:40px;max-width:760px;margin:30px auto;text-align:center}
.hero p{color:var(--ink-2);margin:8px 0 22px;font-size:15px}
.hero .acts{justify-content:center}
.flow-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:28px;text-align:left}
.flow-steps div{background:var(--muted-bg);border-radius:10px;padding:12px;font-size:12.5px;color:var(--ink-2)}
.flow-steps b{display:block;color:var(--ink);margin-bottom:2px}
.flow-steps .k{width:22px;height:22px;border-radius:50%;background:var(--bb);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;margin-bottom:6px}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin-bottom:12px;align-items:center}
.filters input[type=search]{flex:1;min-width:200px}
.filters select{width:auto;min-width:160px}
.bulk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bb);color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:12px;position:sticky;top:64px;z-index:10}
.bulk b{margin-right:4px}
.bulk select,.bulk input{width:auto;background:#fff;color:var(--ink);padding:6px 8px}
.bulk input{width:64px}
.bulk .btn{padding:6px 11px}
.bulk .btn.primary{background:var(--coral);border-color:var(--coral)}
.bulk .link{color:#fff}
.bulk .sep{width:1px;height:24px;background:rgba(255,255,255,.3)}
.bulk label{display:flex;align-items:center;gap:6px;font-size:12.5px}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--muted-bg);white-space:nowrap}
tbody tr:hover td{background:#fafbfc}
tr.sel td{background:var(--bb-soft)!important}
td small{display:block;color:var(--muted);font-size:12px}
td.ck,th.ck{width:36px}
td input[type=checkbox],th input[type=checkbox]{width:16px;height:16px;accent-color:var(--bb)}
input.seats{width:64px;padding:5px 6px;text-align:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip.pend{background:var(--muted-bg);color:var(--ink-2)}
.chip.act{background:var(--bb-soft);color:var(--bb)}
.chip.sent{background:#eef0ff;color:#3b3f9e}
.chip.part{background:var(--warn-bg);color:var(--warn-ink)}
.chip.full{background:var(--good-bg);color:var(--good-ink)}
.tfoot{padding:10px 12px;font-size:12.5px;color:var(--muted)}

/* ---------- Diseño ---------- */
.design{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
.design .form{padding:18px;display:grid;gap:14px}
.design .form h2{margin:6px 0 0;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.upl{display:flex;gap:8px;align-items:center}
.upl .thumb{width:46px;height:46px;border-radius:8px;border:1px solid var(--line);background:var(--muted-bg) center/cover no-repeat;flex:none}
.upl .thumb.logo{background-size:contain;background-color:#fff}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:1px solid var(--line-2);border-radius:10px;padding:8px;cursor:pointer;text-align:center;font-size:12px;font-weight:600;color:var(--ink-2);background:#fff}
.opt.on{border-color:var(--bb);box-shadow:0 0 0 2px var(--bb-soft);color:var(--bb)}
.opt svg{display:block;margin:0 auto 6px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{display:flex;gap:8px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-2);cursor:pointer}
.sw button.on{box-shadow:0 0 0 2px var(--bb)}
.preview{padding:18px;display:grid;gap:12px;justify-items:center}
.preview canvas{width:100%;max-width:440px;height:auto;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.preview .acts{justify-content:center}
.preview .pvsel{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.preview .pvsel select{width:auto}

/* ---------- Confirmaciones ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:16px}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.kpi .f{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.kpi.hl{background:var(--bb);border-color:var(--bb);color:#fff}
.kpi.hl .k,.kpi.hl .f{color:rgba(255,255,255,.8)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.card.pad{padding:18px}
.bar{position:relative;height:10px;background:var(--muted-bg);border-radius:5px;overflow:hidden;min-width:120px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--bb);border-radius:5px}
.feed{display:grid}
.feed div{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:9px 2px;border-bottom:1px solid var(--line)}
.feed div:last-child{border-bottom:0}
.feed .t{font-size:12px;color:var(--muted);grid-row:span 2;min-width:92px}
.feed small{color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* ---------- Ingreso ---------- */
body.login{display:grid;place-items:center;background:linear-gradient(160deg,#eaf1f8,#f7f8fa)}
.login-wrap{width:min(400px,92vw);display:grid;gap:14px;text-align:center}
.login{padding:30px;display:grid;gap:14px;text-align:left}
.login img{width:64px;height:64px;margin:0 auto}
.login h1{text-align:center;color:var(--bb);font-size:22px}
.login .sub{text-align:center;color:var(--muted);margin-top:-8px}
.hint{background:var(--bb-soft);color:var(--bb);border-radius:8px;padding:8px 10px;font-size:12.5px;text-align:center}
.login-wrap .foot{font-size:13px;color:var(--ink-2)}

/* ---------- Página pública de confirmación ---------- */
body.public{background:#0e1726}
.r-page{max-width:460px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}
.r-head{position:relative;padding:34px 24px 28px;color:#fff;text-align:center;background:radial-gradient(120% 90% at 50% 0%,#1f3a5f 0%,#0b1220 70%) center/cover no-repeat}
.r-head::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.6))}
.r-head > *{position:relative}
.r-head img{max-width:180px;max-height:80px;object-fit:contain;margin-bottom:14px}
.r-head h1{font-size:26px;line-height:1.15}
.r-head p{opacity:.9;margin-top:6px;font-size:14px}
.r-body{padding:24px;display:grid;gap:16px;flex:1}
.r-hi{font-size:18px}
.r-seats{display:flex;justify-content:space-between;align-items:center;background:var(--muted-bg);border-radius:10px;padding:12px 14px}
.r-seats b{font-size:20px}
.r-list{display:grid;gap:6px}
.r-list div{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:var(--good-bg);color:var(--good-ink);font-weight:600}
.r-form{display:grid;gap:10px}
.r-form .btn{padding:12px;font-size:15px}
.r-ok{background:var(--good-bg);color:var(--good-ink);border-radius:12px;padding:14px;text-align:center;font-weight:600}
.r-ok big{display:block;font-size:30px;line-height:1}
.r-full{background:var(--bb-soft);color:var(--bb);border-radius:12px;padding:14px;text-align:center;font-weight:600}
.r-share{border:1px dashed var(--line-2);border-radius:12px;padding:14px;font-size:13px;color:var(--ink-2);display:grid;gap:10px}
.r-foot{padding:16px 24px;font-size:11.5px;color:var(--muted);text-align:center;border-top:1px solid var(--line)}
.r-err{background:var(--crit-bg);color:var(--crit);border-radius:10px;padding:12px;font-weight:600;text-align:center}

/* ---------- Ventana y avisos ---------- */
.modal-back{position:fixed;inset:0;background:rgba(10,14,20,.55);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:#fff;border-radius:14px;width:min(820px,100%);max-height:94vh;overflow:auto;display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:22px;padding:22px;position:relative}
.modal canvas{width:100%;height:auto;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.modal .side{display:grid;gap:12px;align-content:start}
.modal .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);width:34px;height:34px;border-radius:8px}
.modal .x:hover{background:var(--muted-bg)}
.codebox{font-size:22px;font-weight:700;color:var(--bb);background:var(--bb-soft);border-radius:10px;padding:10px 14px;text-align:center}
.urlbox{font-size:12px;word-break:break-all;background:var(--muted-bg);border-radius:8px;padding:8px 10px;color:var(--ink-2)}
.modal .acts .btn{flex:1}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:13.5px;z-index:70;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:90vw}
.toast.err{background:var(--crit)}

@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2,.design{grid-template-columns:1fr}
  .flow-steps{grid-template-columns:1fr 1fr}
  .steps a span.l{display:none}
  .modal{grid-template-columns:1fr}
}
</style>
<script src="vendor/qrcode.min.js"></script>
<script src="vendor/jszip.min.js"></script>
</head>
<body>
<div id="app"></div>
<div class="modal-back" id="modalBack" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileIn" hidden>

<script>
(function(){
'use strict';

/* =================== Utilidades =================== */
const KEY = 'invqr_demo_v1', SESSION = 'invqr_session';
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);
const sum = (arr, f) => arr.reduce((t, x) => t + (f ? f(x) : x), 0);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const fmtTime = iso => new Date(iso).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const fmtCode = c => c ? c.slice(0, 4) + '-' + c.slice(4) : '';
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

const DEFAULT_EVENT = {
  name: 'Noche Courtside 2026', date: 'Sábado 14 de noviembre · 19:00 h', place: 'Arena Ciudad de México',
  message: 'Te esperamos para vivir una noche inolvidable.', bg: null, logo: null, layout: 'abajo', text: 'light', accent: '#ff7a1a'
};
const ACCENTS = ['#ff7a1a', '#ee4035', '#f5c518', '#2fbf71', '#3b82f6', '#ffffff'];

/* =================== Estado =================== */
function blank(){ return { v: 1, event: Object.assign({}, DEFAULT_EVENT), guests: [] }; }
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw){ const s = JSON.parse(raw); if (s && s.v === 1){ s.event = Object.assign({}, DEFAULT_EVENT, s.event || {}); s.guests = Array.isArray(s.guests) ? s.guests : []; return s; } }
  } catch (e){ console.error(e); }
  return blank();
}
let S = load();
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch (e){ toast('No se pudo guardar: la imagen es muy pesada. Prueba con una más ligera.', true); return false; }
}
const logged = () => { try { return sessionStorage.getItem(SESSION) === '1'; } catch (e){ return true; } };
const UI = { q: '', group: '', status: '', sel: new Set(), pv: '' };
const R = { flash: '' };

/* =================== Reglas de negocio =================== */
const used = g => (g.redemptions || []).length;
const left = g => Math.max(0, g.seats - used(g));
function status(g){
  const u = used(g);
  if (!g.code) return { k: 'pend', label: 'Pendiente' };
  if (u >= g.seats) return { k: 'full', label: 'Confirmado ' + u + ' de ' + g.seats };
  if (u > 0) return { k: 'part', label: 'Confirmado ' + u + ' de ' + g.seats };
  if (g.sentAt) return { k: 'sent', label: 'Enviado' };
  return { k: 'act', label: 'QR listo' };
}
const STATUS_OPTS = [['', 'Todos los estados'], ['pend', 'Pendiente'], ['act', 'QR listo'], ['sent', 'Enviado sin confirmar'], ['part', 'Confirmado parcial'], ['full', 'Confirmado completo']];
const groupList = () => [...new Set(S.guests.map(g => g.group).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
const ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function newCode(){
  const taken = new Set(S.guests.map(g => g.code).filter(Boolean));
  for (;;){
    const buf = new Uint32Array(8); crypto.getRandomValues(buf);
    const c = [...buf].map(n => ALPH[n % ALPH.length]).join('');
    if (!taken.has(c)) return c;
  }
}
const redeemUrl = code => location.href.split('#')[0] + '#/r/' + code;
const isSentLike = g => g.code && (g.sentAt || used(g) > 0);

/* =================== CSV =================== */
const ALIASES = {
  name: ['nombre', 'name', 'nombre completo', 'invitado'],
  email: ['correo', 'email', 'e-mail', 'mail', 'correo electronico'],
  company: ['empresa', 'company', 'compania', 'organizacion'],
  group: ['grupo', 'group', 'categoria'],
  seats: ['lugares', 'seats', 'pases', 'acompanantes', 'boletos'],
  extra1: ['campo1', 'campo 1', 'extra1', 'extra 1'],
  extra2: ['campo2', 'campo 2', 'extra2', 'extra 2']
};
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim){ row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
function importCSV(text){
  const rows = parseCSV(text);
  if (rows.length < 2) return toast('El archivo no tiene invitados.', true);
  const head = rows[0].map(norm), col = k => head.findIndex(h => ALIASES[k].includes(h));
  const ix = {}; Object.keys(ALIASES).forEach(k => { ix[k] = col(k); });
  if (ix.name < 0) return toast('El CSV necesita una columna "nombre".', true);
  const emails = new Set(S.guests.map(g => g.email).filter(Boolean));
  let added = 0, dup = 0;
  rows.slice(1).forEach(r => {
    const v = k => ix[k] >= 0 ? String(r[ix[k]] || '').trim() : '';
    const name = v('name'); if (!name) return;
    const email = v('email').toLowerCase();
    if (email && emails.has(email)){ dup++; return; }
    if (email) emails.add(email);
    S.guests.push({ id: uid(), name, email, company: v('company'), group: v('group'), extra1: v('extra1'), extra2: v('extra2'), seats: Math.min(20, Math.max(1, parseInt(v('seats'), 10) || 1)), code: null, activatedAt: null, sentAt: null, redemptions: [] });
    added++;
  });
  save(); render();
  toast(plural(added, 'invitado cargado', 'invitados cargados') + (dup ? ', ' + plural(dup, 'repetido omitido', 'repetidos omitidos') : ''));
}
function sampleGuests(){
  const data = [
    ['Patrocinadores', 4, [['Ana Lucía Torres', 'Grupo Andino'], ['Bernardo Ríos', 'Logística Alfa'], ['Carla Méndez', 'Banca Meridiano'], ['Diego Salinas', 'Bebidas Solaris'], ['Elena Fuentes', 'Telecom Aurora'], ['Fernando Ibarra', 'Constructora Vértice'], ['Gabriela Ochoa', 'Distribuidora Cumbre'], ['Héctor Villalobos', 'Grupo Andino']]],

const imgCache = {};
function loadImg(src){
  if (!src) return Promise.resolve(null);
  if (!imgCache[src]) imgCache[src] = new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  return imgCache[src];
}
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function cover(ctx, img, W, H){ const s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s; ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h); }
function wrap(ctx, text, maxW){
  const words = String(text || '').split(/\s+/).filter(Boolean), lines = []; let cur = '';
  words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur);
  return lines;
}
function textBlock(ctx, text, x, y, maxW, size, lh, weight, color, align, maxLines){
  ctx.font = `${weight} ${size}px "Segoe UI", system-ui, sans-serif`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  let lines = wrap(ctx, text, maxW);
  if (maxLines && lines.length > maxLines){ lines = lines.slice(0, maxLines); lines[maxLines - 1] += '…'; }
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lh));
  return y + (lines.length - 1) * lh;
}
function defaultBg(ctx, W, H, light, accent){
  const g = ctx.createRadialGradient(W / 2, H * .18, 60, W / 2, H * .35, H);
  if (light){ g.addColorStop(0, '#22406a'); g.addColorStop(.55, '#0d1a2e'); g.addColorStop(1, '#05080f'); }
  else { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#e9e4d8'); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // Líneas de cancha, sutiles
  ctx.save(); ctx.strokeStyle = light ? 'rgba(255,255,255,.07)' : 'rgba(0,0,0,.07)'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(W / 2, H * .55, 230, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, H * .55, 70, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, H * .55); ctx.lineTo(W, H * .55); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, -60, 560, 0, Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, H + 60, 560, Math.PI, Math.PI * 2); ctx.stroke();
  ctx.restore();
  const glow = ctx.createRadialGradient(W * .85, H * .1, 10, W * .85, H * .1, 520);
  glow.addColorStop(0, accent + '55'); glow.addColorStop(1, accent + '00');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
}
function drawQR(ctx, text, x, y, size){
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), quiet = 2, cell = size / (n + quiet * 2);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, size, size);
  ctx.fillStyle = '#0b0f17';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++){
    if (qr.isDark(r, c)) ctx.fillRect(Math.floor(x + (c + quiet) * cell), Math.floor(y + (r + quiet) * cell), Math.ceil(cell), Math.ceil(cell));
  }
}
function qrCard(ctx, g, x, y, size, codeColor){
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 30; ctx.fillStyle = '#fff'; rr(ctx, x, y, size, size, 26); ctx.fill(); ctx.restore();
  drawQR(ctx, redeemUrl(g.code), x + 22, y + 22, size - 44);
  ctx.font = '700 34px ui-monospace, Consolas, monospace'; ctx.textAlign = 'center'; ctx.fillStyle = codeColor;
  ctx.fillText(fmtCode(g.code), x + size / 2, y + size + 50);
}
const seatsLine = g => g.seats > 1 ? 'Pase para ' + g.seats + ' personas' : 'Pase individual';
async function drawInvitation(cv, g){
  const E = S.event, W = 1080, H = 1350; cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'), light = E.text !== 'dark';
  const ink = light ? '#ffffff' : '#111111', ink2 = light ? 'rgba(255,255,255,.82)' : 'rgba(17,17,17,.72)', accent = E.accent || '#ff7a1a';
  const accentTxt = (!light && accent.toLowerCase() === '#ffffff') ? '#111111' : accent;
  const [bg, logo] = await Promise.all([loadImg(E.bg), loadImg(E.logo)]);
  ctx.clearRect(0, 0, W, H);
  if (bg){
    cover(ctx, bg, W, H);
    const v = ctx.createLinearGradient(0, 0, 0, H);
    if (light){ v.addColorStop(0, 'rgba(0,0,0,.45)'); v.addColorStop(.45, 'rgba(0,0,0,.2)'); v.addColorStop(1, 'rgba(0,0,0,.8)'); }
    else { v.addColorStop(0, 'rgba(255,255,255,.7)'); v.addColorStop(.5, 'rgba(255,255,255,.35)'); v.addColorStop(1, 'rgba(255,255,255,.85)'); }
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  } else defaultBg(ctx, W, H, light, accent);
  const drawLogo = (cx, top, maxW, maxH, align) => {
    if (!logo) return top;
    const s = Math.min(maxW / logo.width, maxH / logo.height), w = logo.width * s, h = logo.height * s;
    ctx.drawImage(logo, align === 'left' ? cx : cx - w / 2, top, w, h); return top + h;
  };
  const L = E.layout;
  if (L === 'tarjeta'){
    drawLogo(W / 2, 70, 380, 150, 'center');
    const cx = 110, cy = 270, cw = 860, ch = 1000;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 40; ctx.fillStyle = '#ffffff'; rr(ctx, cx, cy, cw, ch, 36); ctx.fill(); ctx.restore();
    ctx.fillStyle = accent === '#ffffff' ? '#111111' : accent; rr(ctx, cx, cy, cw, 14, 7); ctx.fill();
    let y = textBlock(ctx, E.name, W / 2, cy + 100, 760, 58, 64, 800, '#111111', 'center', 2);
    y = textBlock(ctx, E.date, W / 2, y + 54, 760, 30, 38, 600, '#374151', 'center', 1);
    y = textBlock(ctx, E.place, W / 2, y + 40, 760, 28, 36, 500, '#6b7280', 'center', 1);
    textBlock(ctx, 'Invitación para', W / 2, y + 74, 760, 26, 32, 500, '#6b7280', 'center', 1);
    y = textBlock(ctx, g.name, W / 2, y + 128, 760, 50, 56, 800, '#111111', 'center', 2);
    textBlock(ctx, seatsLine(g), W / 2, y + 46, 760, 28, 34, 700, accentTxt === '#ffffff' ? '#111111' : accent, 'center', 1);
    const qs = 400; qrCard(ctx, g, (W - qs) / 2, cy + ch - qs - 110, qs, '#111111');
  } else if (L === 'lateral'){
    drawLogo(80, 80, 360, 150, 'left');
    let y = textBlock(ctx, E.name, 80, 470, 900, 84, 90, 800, ink, 'left', 3);
    ctx.fillStyle = accent; ctx.fillRect(80, y + 36, 120, 8);
    y = textBlock(ctx, E.date, 80, y + 100, 900, 36, 44, 600, ink, 'left', 1);
    y = textBlock(ctx, E.place, 80, y + 46, 900, 32, 40, 500, ink2, 'left', 1);
    const qs = 340, qx = W - 80 - qs, qy = H - 80 - qs - 60;
    textBlock(ctx, 'Invitación para', 80, qy + 40, qx - 120, 28, 34, 500, ink2, 'left', 1);
    let ny = textBlock(ctx, g.name, 80, qy + 104, qx - 120, 54, 60, 800, ink, 'left', 3);
    textBlock(ctx, seatsLine(g), 80, ny + 52, qx - 120, 30, 36, 700, accentTxt, 'left', 1);
    qrCard(ctx, g, qx, qy, qs, ink);
  } else {
    const ly = drawLogo(W / 2, 80, 420, 160, 'center');
    let y = textBlock(ctx, E.name, W / 2, Math.max(ly + 110, 300), 920, 74, 82, 800, ink, 'center', 2);
    y = textBlock(ctx, E.date, W / 2, y + 62, 920, 34, 42, 600, ink, 'center', 1);
    y = textBlock(ctx, E.place, W / 2, y + 44, 920, 30, 38, 500, ink2, 'center', 1);
    ctx.fillStyle = accent; ctx.fillRect(W / 2 - 60, y + 36, 120, 7);
    textBlock(ctx, 'Invitación para', W / 2, y + 100, 920, 28, 34, 500, ink2, 'center', 1);
    y = textBlock(ctx, g.name, W / 2, y + 160, 920, 56, 62, 800, ink, 'center', 2);
    textBlock(ctx, seatsLine(g), W / 2, y + 50, 920, 30, 36, 700, accentTxt, 'center', 1);
    const qs = 360; qrCard(ctx, g, (W - qs) / 2, H - qs - 120, qs, ink);
  }
  ctx.font = '500 24px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = L === 'tarjeta' ? (light ? 'rgba(255,255,255,.85)' : 'rgba(17,17,17,.7)') : ink2;
  ctx.fillText(E.message ? E.message + '  ·  Escanea el código para confirmar' : 'Escanea el código para confirmar tu asistencia', W / 2, H - 34);
  return cv;
}
const fileName = g => norm(g.name).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') + '_' + g.code + '.png';
async function downloadOne(g){
  const cv = await drawInvitation(document.createElement('canvas'), g);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  downloadBlob(blob, fileName(g));
  if (!g.sentAt){ g.sentAt = new Date().toISOString(); save(); }
}
async function downloadZip(list){
  list = list.filter(g => g.code);
  if (!list.length) return toast('No hay invitaciones activas. Actívalas primero en el paso 1.', true);
  if (list.length === 1){ await downloadOne(list[0]); render(); return toast('Invitación descargada y marcada como enviada'); }
  toast('Generando ' + list.length + ' invitaciones…');
  const zip = new JSZip(), cv = document.createElement('canvas');
  for (const g of list){
    await drawInvitation(cv, g);
    zip.file(fileName(g), await new Promise(r => cv.toBlob(r, 'image/png')));
  }
  downloadBlob(await zip.generateAsync({ type: 'blob' }), 'invitaciones.zip');
  const now = new Date().toISOString(); list.forEach(g => { if (!g.sentAt) g.sentAt = now; });
  save(); render(); toast(plural(list.length, 'invitación descargada', 'invitaciones descargadas') + ' en ZIP y marcadas como enviadas');
}

      <div class="seg2"><button class="opt${E.text !== 'dark' ? ' on' : ''}" data-act="text" data-k="light">Texto claro</button><button class="opt${E.text === 'dark' ? ' on' : ''}" data-act="text" data-k="dark">Texto oscuro</button></div>
      <div><div class="help" style="margin-bottom:6px;font-weight:600">Color de acento</div><div class="sw">${ACCENTS.map(c => `<button style="background:${c}" class="${E.accent === c ? 'on' : ''}" data-act="accent" data-k="${c}" aria-label="Acento ${c}"></button>`).join('')}</div></div>
    </section>
    <section class="card preview">
      <canvas id="pv" width="1080" height="1350" aria-label="Vista previa de la invitación"></canvas>
      ${act.length ? `<div class="pvsel">Vista previa con <select data-chg="pv">${act.map(g => `<option value="${g.id}"${g.id === pg.id ? ' selected' : ''}>${esc(g.name)}</option>`).join('')}</select></div>` : '<p class="help">Vista previa con un invitado de ejemplo. Activa pases en el paso 1 para ver los reales.</p>'}
      <div class="acts"><button class="btn" data-act="dlPreview"${act.length ? '' : ' disabled'}>Descargar esta</button><button class="btn primary" data-act="dlAll"${act.length ? '' : ' disabled'}>Descargar todas (${act.length}) en ZIP</button></div>
      <p class="help">Imágenes de 1080 × 1350, listas para WhatsApp o correo. Al descargarlas se marcan como enviadas.</p>
    </section>
  </div>`;
}
function viewConfirmaciones(){
  const G = S.guests, sent = G.filter(isSentLike), conf = sent.filter(g => used(g) > 0);
  const seatsSent = sum(sent, g => g.seats), seatsConf = sum(sent, used), rate = pct(conf.length, sent.length);
  const groups = groupList().concat(G.some(g => !g.group) ? [''] : []);
  const rows = groups.map(gr => { const s = sent.filter(g => (g.group || '') === gr), c = s.filter(g => used(g) > 0); return { gr, s: s.length, c: c.length, seats: sum(s, g => g.seats), used: sum(s, used) }; }).filter(r => r.s > 0);
  const feed = G.flatMap(g => (g.redemptions || []).map(r => ({ r, g }))).sort((a, b) => a.r.at < b.r.at ? 1 : -1).slice(0, 12);
  const pend = sent.length - conf.length;
  return `<div class="vhead"><div><h1>Confirmaciones</h1><p>Cada QR redimido cuenta como asistencia confirmada. Se actualiza solo.</p></div>
    <div class="acts"><button class="btn" data-act="simulate">Simular confirmaciones</button><button class="btn" data-act="export"${G.length ? '' : ' disabled'}>Exportar a CSV</button></div></div>
  <div class="kpis">
    <div class="card kpi"><div class="k">Invitados en la lista</div><div class="v num">${G.length}</div><div class="f">${plural(G.filter(g => g.code).length, 'pase activo', 'pases activos')}</div></div>
    <div class="card kpi"><div class="k">Invitaciones enviadas</div><div class="v num">${sent.length}</div><div class="f">${plural(seatsSent, 'lugar', 'lugares')} en total</div></div>
    <div class="card kpi"><div class="k">Pases confirmados</div><div class="v num">${conf.length}</div><div class="f">${pend ? plural(pend, 'pendiente', 'pendientes') + ' de confirmar' : 'Ninguno pendiente'}</div></div>
    <div class="card kpi hl"><div class="k">Tasa de confirmación</div><div class="v num">${rate}%</div><div class="f">Confirmados contra enviados</div></div>
    <div class="card kpi"><div class="k">Asistentes confirmados</div><div class="v num">${seatsConf}</div><div class="f">de ${plural(seatsSent, 'lugar asignado', 'lugares asignados')}</div></div>
  </div>
  <div class="grid2">
    <section class="card pad"><h2>Avance por grupo</h2>
      ${rows.length ? `<div class="twrap"><table><thead><tr><th>Grupo</th><th class="num">Enviadas</th><th class="num">Confirmadas</th><th>Tasa</th><th class="num">Asistentes</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td><b>${esc(r.gr) || '<span class="muted">Sin grupo</span>'}</b></td><td class="num">${r.s}</td><td class="num">${r.c}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar"><i style="width:${pct(r.c, r.s)}%"></i></div><span class="num">${pct(r.c, r.s)}%</span></div></td><td class="num">${r.used} de ${r.seats}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty"><b>Aún no hay invitaciones enviadas</b>Activa pases en el paso 1 y descárgalos en el paso 2.</div>'}
    </section>
    <section class="card pad"><h2>Últimas confirmaciones</h2>
      ${feed.length ? `<div class="feed">${feed.map(({ r, g }) => `<div><span class="t">${fmtTime(r.at)}</span><b>${esc(r.name)}</b><small>Pase de ${esc(g.name)}${g.group ? ' · ' + esc(g.group) : ''}</small></div>`).join('')}</div>`
        : '<div class="empty"><b>Sin confirmaciones todavía</b>Abre una invitación y escanea su QR, o usa "Simular confirmaciones".</div>'}
    </section>
  </div>`;
}
function viewRedeem(raw){
  const E = S.event, code = String(raw || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase(), g = code ? S.guests.find(x => x.code === code) : null;
  const head = `<header class="r-head" style="${E.bg ? `background-image:url(${E.bg})` : ''}">${E.logo ? `<img src="${E.logo}" alt="">` : ''}<h1>${esc(E.name)}</h1><p>${esc(E.date)}<br>${esc(E.place)}</p></header>`;
  const foot = `<footer class="r-foot">Demo: la confirmación se guarda en este navegador.<br>Invitaciones QR · Baobyte</footer>`;
  const codeForm = `<form class="r-form" data-form="findCode"><label class="f">Código de tu invitación<input name="c" class="mono" placeholder="ABCD-1234" autocomplete="off" required></label><button class="btn primary">Buscar mi invitación</button></form>`;
  if (!g) return `<div class="r-page">${head}<div class="r-body">${code ? '<div class="r-err">No encontramos ese código. Revisa que esté bien escrito.</div>' : '<p class="r-hi">Confirma tu asistencia</p>'}${codeForm}</div>${foot}</div>`;
  const u = used(g), l = left(g), flash = R.flash; R.flash = '';
  return `<div class="r-page">${head}<div class="r-body">
    ${flash ? `<div class="r-ok"><big>✓</big>Listo, ${esc(flash)}. Tu lugar está confirmado.</div>` : ''}
    <p class="r-hi">Pase de <b>${esc(g.name)}</b></p>
    <div class="r-seats"><span>${g.seats > 1 ? 'Vale para ' + g.seats + ' personas' : 'Pase individual'}</span><span>Quedan <b class="num">${l}</b></span></div>
    ${u ? `<div class="r-list">${g.redemptions.map(r => `<div>✓ ${esc(r.name)}</div>`).join('')}</div>` : ''}
    ${l > 0 ? `<form class="r-form" data-form="redeem" data-code="${g.code}">
        <label class="f">Nombre de quien asiste<input name="n" required maxlength="80" value="${u ? '' : esc(g.name)}" autocomplete="name"></label>
        <label class="f">Correo <span class="muted" style="font-weight:400">opcional</span><input name="e" type="email" maxlength="120" autocomplete="email"></label>
        <button class="btn coral">Confirmar asistencia</button></form>`
      : '<div class="r-full">Todos los lugares de este pase ya están confirmados. ¡Nos vemos en el evento!</div>'}
    ${g.seats > 1 && l > 0 ? `<div class="r-share">¿Vienes acompañado? Comparte esta misma invitación: cada persona abre el enlace y confirma su lugar con su nombre.<button class="btn" data-act="share" data-code="${g.code}">Compartir invitación</button></div>` : ''}
  </div>${foot}</div>`;
}

/* =================== Render y navegación =================== */
const VIEWS = { invitados: viewInvitados, diseno: viewDiseno, confirmaciones: viewConfirmaciones };
function render(){
  const h = location.hash.slice(1) || '/';
  if (h === '/r' || h.startsWith('/r/')){ document.body.className = 'public'; $('#app').innerHTML = viewRedeem(decodeURIComponent(h.slice(3))); return; }
  if (!logged()){ document.body.className = 'login'; $('#app').innerHTML = viewLogin(); return; }
  document.body.className = 'admin';
  const tab = Object.keys(VIEWS).find(t => h === '/admin/' + t) || 'invitados';
  const y = window.scrollY;
  $('#app').innerHTML = shell(tab, VIEWS[tab]());
  window.scrollTo(0, y);
  if (tab === 'diseno') drawPreview();
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
window.addEventListener('storage', e => { if (e.key === KEY){ S = load(); if (!document.activeElement || !document.activeElement.matches('input,textarea')) render(); } });

/* =================== Acciones =================== */
const selected = () => S.guests.filter(g => UI.sel.has(g.id));
let pickHandler = null;
function pickFile(accept, fn){ const f = $('#fileIn'); f.value = ''; f.accept = accept; pickHandler = fn; f.click(); }
$('#fileIn').addEventListener('change', e => { const file = e.target.files[0]; if (file && pickHandler) pickHandler(file); });
function readImage(file, maxDim, keepPng){
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, maxDim / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      res(keepPng ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', .86));
    }; img.onerror = () => rej(new Error('No se pudo leer la imagen')); img.src = rd.result; };
    rd.onerror = () => rej(new Error('No se pudo leer el archivo')); rd.readAsDataURL(file);
  });
}
function activate(list){
  const now = new Date().toISOString(); let n = 0;
  list.forEach(g => { if (!g.code){ g.code = newCode(); g.activatedAt = now; n++; } });
  save(); render();
  toast(n ? plural(n, 'pase activado', 'pases activados') + '. Ya tienen su QR.' : 'Los seleccionados ya estaban activos.');
}
const ACTIONS = {
  logout(){ try { sessionStorage.removeItem(SESSION); } catch (e){} location.hash = '#/'; render(); },
  reset(){ if (!confirm('Se borran los invitados, el diseño y las confirmaciones de esta demo. ¿Continuar?')) return; S = blank(); UI.sel.clear(); UI.q = UI.group = UI.status = ''; save(); location.hash = '#/admin/invitados'; render(); toast('Demo reiniciada'); },
  pickCsv(){ pickFile('.csv,text/csv', file => { const rd = new FileReader(); rd.onload = () => importCSV(String(rd.result)); rd.readAsText(file, 'utf-8'); }); },
  sample(){ S.guests = S.guests.concat(sampleGuests()); save(); render(); toast('Lista de ejemplo cargada: 32 invitados en 4 grupos'); },
  template(){ downloadBlob(new Blob(['﻿nombre,correo,empresa,grupo,lugares,campo1,campo2\nAna López,ana.lopez@ejemplo.com,Empresa Uno,Clientes VIP,2,,\nLuis Pérez,luis.perez@ejemplo.com,Empresa Dos,Medios,1,,\n'], { type: 'text/csv' }), 'plantilla_invitados.csv'); },
  clearSel(){ UI.sel.clear(); render(); },
  applySeats(){
    const v = Math.min(20, Math.max(1, parseInt($('#bulkSeats').value, 10) || 1)); let skip = 0;
    selected().forEach(g => { if (used(g) > v) skip++; else g.seats = v; });
    save(); render(); toast('Lugares actualizados' + (skip ? '. ' + plural(skip, 'pase ya tenía', 'pases ya tenían') + ' más confirmados y no cambió' : ''));
  },
  activate(){ activate(selected()); },
  activateOne: d => activate(S.guests.filter(g => g.id === d.id)),
  markSent(){ const now = new Date().toISOString(), act = selected().filter(g => g.code); act.forEach(g => { if (!g.sentAt) g.sentAt = now; }); save(); render(); toast(act.length ? plural(act.length, 'invitación marcada', 'invitaciones marcadas') + ' como enviada' + (act.length > 1 ? 's' : '') : 'Primero activa los pases', !act.length); },
  dlSel(){ downloadZip(selected()); },
  dlAll(){ downloadZip(S.guests.filter(g => g.code)); },
  async dlPreview(){ const g = previewGuest(); if (!g.id) return; await downloadOne(g); render(); toast('Invitación descargada y marcada como enviada'); },
  card: d => openCard(d.id),
  async dlCard(d){ const g = S.guests.find(x => x.id === d.id); await downloadOne(g); closeModal(); render(); toast('Invitación descargada y marcada como enviada'); },
  async copyLink(d){ const g = S.guests.find(x => x.id === d.id); try { await navigator.clipboard.writeText(redeemUrl(g.code)); toast('Enlace copiado'); } catch (e){ toast('No se pudo copiar el enlace', true); } },
  closeModal,
  pickImg: d => pickFile('image/*', async file => {
    try { const url = await readImage(file, d.kind === 'logo' ? 700 : 1600, d.kind === 'logo'); const prev = S.event[d.kind]; S.event[d.kind] = url; if (!save()){ S.event[d.kind] = prev; return; } render(); toast(d.kind === 'logo' ? 'Logo listo' : 'Fondo listo'); }
    catch (e){ toast(e.message, true); }
  }),
  clearImg: d => { S.event[d.kind] = null; save(); render(); },
  layout: d => { S.event.layout = d.k; save(); render(); },
  text: d => { S.event.text = d.k; save(); render(); },
  accent: d => { S.event.accent = d.k; save(); render(); },
  simulate(){
    const pool = S.guests.filter(g => g.code && left(g) > 0);
    if (!pool.length) return toast('Primero activa pases en el paso 1.', true);
    const extra = ['Mariana Ruiz', 'Roberto Garza', 'Sofía Aguilar', 'Tomás Rivera', 'Lucía Paredes', 'Álvaro Núñez', 'Paula Serrano', 'Manuel Ortega'];
    const now = Date.now(), pick = pool.filter(() => Math.random() < .45); if (!pick.length) pick.push(pool[0]);
    pick.forEach(g => {
      if (!g.sentAt) g.sentAt = new Date(now - 4 * 864e5).toISOString();
      const k = 1 + Math.floor(Math.random() * left(g));
      for (let i = 0; i < k; i++) g.redemptions.push({ id: uid(), name: used(g) === 0 ? g.name : extra[Math.floor(Math.random() * extra.length)], email: '', at: new Date(now - Math.floor(Math.random() * 3 * 864e5)).toISOString() });
    });
    save(); render(); toast(plural(pick.length, 'pase confirmó', 'pases confirmaron') + ' en la simulación');
  },
  export(){
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [['Nombre', 'Correo', 'Empresa', 'Grupo', 'Lugares', 'Código', 'Estado', 'Confirmados', 'Nombres confirmados', 'Campo 1', 'Campo 2'].map(q).join(',')]
      .concat(S.guests.map(g => [g.name, g.email, g.company, g.group, g.seats, fmtCode(g.code), status(g).label, used(g), (g.redemptions || []).map(r => r.name).join(' | '), g.extra1, g.extra2].map(q).join(',')));
    downloadBlob(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv' }), 'confirmaciones.csv');
  },
  async share(d){
    const url = redeemUrl(d.code), data = { title: S.event.name, text: 'Te comparto mi invitación a ' + S.event.name + '. Confirma tu lugar aquí:', url };
    try { if (navigator.share){ await navigator.share(data); return; } await navigator.clipboard.writeText(url); toast('Enlace copiado. Pégalo en WhatsApp para compartirlo.'); }
    catch (e){ if (e && e.name !== 'AbortError') toast('Copia el enlace de esta página para compartirla.'); }
  }
};
async function openCard(id){
  const g = S.guests.find(x => x.id === id); if (!g) return;
  const st = status(g);
  $('#modal').innerHTML = `<button class="x" data-act="closeModal" aria-label="Cerrar">&times;</button>
    <div><canvas id="cardCv" width="1080" height="1350"></canvas></div>
    <div class="side"><h2 style="font-size:18px;margin:0">${esc(g.name)}</h2><p class="help">${esc(g.company)}${g.group ? ' · ' + esc(g.group) : ''}</p>
      <div class="codebox mono">${fmtCode(g.code)}</div>
      <p class="help">${g.seats > 1 ? 'Pase para ' + g.seats + ' personas' : 'Pase individual'} · <span class="chip ${st.k}">${st.label}</span></p>
      <div class="urlbox">${esc(redeemUrl(g.code))}</div>
      <div class="acts"><button class="btn primary" data-act="dlCard" data-id="${g.id}">Descargar imagen</button><button class="btn" data-act="copyLink" data-id="${g.id}">Copiar enlace</button></div>
      <a class="btn" href="#/r/${g.code}" target="_blank" rel="noopener">Abrir página de confirmación</a>
      <p class="help">En la demo, abre la página de confirmación en otra pestaña y confirma: este panel se actualiza solo.</p></div>`;
  $('#modalBack').hidden = false;
  await drawInvitation($('#cardCv'), g);
}
function closeModal(){ $('#modalBack').hidden = true; $('#modal').innerHTML = ''; }

const CHANGES = {
  fgroup: el => { UI.group = el.value; render(); },
  fstatus: el => { UI.status = el.value; render(); },
  sel: el => { el.checked ? UI.sel.add(el.dataset.id) : UI.sel.delete(el.dataset.id); render(); },
  selAll: el => { filtered().forEach(g => el.checked ? UI.sel.add(g.id) : UI.sel.delete(g.id)); render(); },
  seats: el => { const g = S.guests.find(x => x.id === el.dataset.id); const v = Math.min(20, Math.max(used(g) || 1, parseInt(el.value, 10) || 1)); g.seats = v; save(); render(); },
  bulkGroup: el => {
    let v = el.value; if (!v) return;
    if (v === '__new'){ v = (prompt('Nombre del nuevo grupo') || '').trim(); if (!v){ render(); return; } }
    const list = selected(); list.forEach(g => { g.group = v; }); save(); render(); toast(plural(list.length, 'invitado', 'invitados') + ' en el grupo "' + v + '"');
  },
  pv: el => { UI.pv = el.value; drawPreview(); }
};
const FORMS = {
  login(f){
    const u = f.elements.u.value.trim(), p = f.elements.p.value;
    if (u === 'admin' && p === 'demo2026'){ try { sessionStorage.setItem(SESSION, '1'); } catch (e){} location.hash = '#/admin/invitados'; render(); }
    else toast('Usuario o contraseña incorrectos', true);
  },
  findCode(f){ const c = f.elements.c.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase(); location.hash = '#/r/' + c; },
  redeem(f){
    const g = S.guests.find(x => x.code === f.dataset.code); if (!g) return;
    S = load(); const fresh = S.guests.find(x => x.code === f.dataset.code);
    const name = f.elements.n.value.trim().replace(/\s+/g, ' ');
    if (!name) return toast('Escribe el nombre de quien asiste', true);
    if (left(fresh) <= 0){ render(); return toast('Este pase ya no tiene lugares disponibles', true); }
    if (fresh.redemptions.some(r => norm(r.name) === norm(name))) return toast(name + ' ya está confirmado en este pase', true);
    fresh.redemptions.push({ id: uid(), name, email: f.elements.e.value.trim(), at: new Date().toISOString() });
    if (!fresh.sentAt) fresh.sentAt = fresh.activatedAt || new Date().toISOString();
    save(); R.flash = name.split(' ')[0]; render(); window.scrollTo(0, 0);
  }
};

/* Edición en vivo del diseño: guarda y redibuja sin recargar la vista */
let evT = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.ev){ S.event[t.dataset.ev] = t.value; clearTimeout(evT); evT = setTimeout(save, 400); drawPreview(); return; }
  if (t.dataset.input === 'q'){ UI.q = t.value; const pos = t.selectionStart; render(); const n = $('[data-input=q]'); if (n){ n.focus(); n.setSelectionRange(pos, pos); } }
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const fn = ACTIONS[t.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(t.dataset, t);
});
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t && CHANGES[t.dataset.chg]) CHANGES[t.dataset.chg](t); });
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form](f); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modalBack').hidden) closeModal(); });
$('#modalBack').addEventListener('mousedown', e => { if (e.target.id === 'modalBack') closeModal(); });

let toastT;
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, err ? 4200 : 2800); }

render();
})();
</script>
