<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1424">
<title>Atrio · Invitaciones de alto nivel</title>
<link rel="icon" href="assets/baobyte.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bb:#014a7d; --coral:#ee4035;
  --side:#0a1424; --side-2:#13233b; --side-3:#1b3150; --side-ink:#e6edf6; --side-muted:#8ea1ba; --side-line:rgba(255,255,255,.08);
  --page:#f3f5f8; --card:#ffffff; --card-2:#f8fafc; --ink:#0f172a; --ink-2:#475569; --muted:#64748b; --line:#e3e8ef; --line-2:#cbd5e1;
  --primary:#014a7d; --primary-2:#0b5f9c; --primary-soft:#e7f0f8; --on-primary:#ffffff;
  --good:#0ca30c; --good-ink:#06640b; --good-bg:#e6f6e7; --warn:#fab219; --warn-ink:#8a5a00; --warn-bg:#fff4dc; --crit:#d03b3b; --crit-bg:#fbe9e9;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06);
  --radius:14px;
  --font:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
}
[data-theme=dark]{
  --side:#060b14; --side-2:#0f1b2e; --side-3:#162843;
  --page:#0a0f18; --card:#111827; --card-2:#0e1520; --ink:#f1f5f9; --ink-2:#cbd5e1; --muted:#94a3b8; --line:#1e293b; --line-2:#334155;
  --primary:#2f80c8; --primary-2:#3b8fd6; --primary-soft:#10243a;
  --good-ink:#4ade80; --good-bg:#0e2a19; --warn-ink:#fbbf24; --warn-bg:#2a2110; --crit:#f87171; --crit-bg:#2c1414;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--ink);background:var(--page);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.04em}
.muted{color:var(--muted)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 15px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-2)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--card-2)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.big{padding:13px 18px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--primary);cursor:pointer;font-weight:600;font-size:13px;padding:2px 4px;border-radius:5px}
.link:hover{text-decoration:underline}
input,select,textarea{border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;background:var(--card);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea{resize:vertical}
label.f{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px;row-gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
label.f > input,label.f > select,label.f > textarea{flex:1 1 100%}
label.f .h{font-weight:400;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:20px}
.help{font-size:13px;color:var(--ink-2)}
.eyebrow{display:block;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);margin-bottom:4px}
h1{font-size:26px;letter-spacing:-.02em;line-height:1.2}
h2{font-size:15px;letter-spacing:-.01em;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--card-2);color:var(--ink-2);border:1px solid var(--line);justify-self:start}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.activa{background:var(--good-bg);color:var(--good-ink);border-color:transparent}
.pill.borrador{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.pill.cerrada{background:var(--card-2);color:var(--muted)}
.pill.demo{background:var(--primary-soft);color:var(--primary);border-color:transparent}

/* ---------- Estructura del panel ---------- */
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--side) 0%,#0c1a2f 100%);color:var(--side-ink);display:flex;flex-direction:column;gap:6px;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side-brand{display:flex;align-items:center;gap:11px;padding:4px 8px 14px}
.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#1d6fb0,#014a7d 55%,#0b2a4a);display:grid;place-items:center;font-family:"Playfair Display",Georgia,serif;font-weight:800;font-size:21px;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.side-brand b{display:block;font-size:17px;letter-spacing:.01em}
.side-brand small{display:block;font-size:11.5px;color:var(--side-muted)}
.drop{position:relative}
.dbtn{display:flex;align-items:center;gap:10px;width:100%;background:var(--side-2);border:1px solid var(--side-line);border-radius:12px;padding:9px 10px;cursor:pointer;text-align:left;color:var(--side-ink)}
.dbtn:hover{background:var(--side-3)}
.dbtn b{display:block;font-size:13.5px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbtn small{display:block;font-size:11.5px;color:var(--side-muted)}
.dbtn > span:nth-child(2){flex:1;min-width:0}
.av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.dmenu{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--side-2);border:1px solid var(--side-line);border-radius:12px;padding:6px;z-index:30;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.dmenu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:9px;padding:8px;cursor:pointer;color:var(--side-ink);text-align:left;font-size:13px}
.dmenu button:hover,.dmenu button.on{background:var(--side-3)}
.dmenu button small{display:block;color:var(--side-muted);font-size:11.5px}
.dmenu hr{border:0;border-top:1px solid var(--side-line);margin:5px 2px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--side-muted)}
.dot.activa{background:#34d399}
.dot.borrador{background:#fbbf24}
.dot.cerrada{background:#64748b}
.side-label{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-weight:500;font-size:14px;opacity:.86}
.nav a:hover{background:var(--side-2);opacity:1}
.nav a.on{background:linear-gradient(90deg,rgba(29,111,176,.35),rgba(29,111,176,.08));opacity:1;font-weight:600;box-shadow:inset 3px 0 0 #4aa3ff}
.nav .n{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.08);flex:none}
.nav a.on .n{background:#4aa3ff;color:#06203a}
.side-foot{margin-top:auto;display:grid;gap:8px;padding-top:12px}
.tgl{display:flex;align-items:center;gap:10px;width:100%;background:none;border:1px solid var(--side-line);border-radius:12px;padding:9px 10px;color:var(--side-ink);cursor:pointer;font-size:13px}
.tgl:hover{background:var(--side-2)}
.sw{margin-left:auto;width:34px;height:20px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:#4aa3ff}
.sw.on::after{left:17px}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--side-2)}
.me b{display:block;font-size:13px}
.me small{display:block;font-size:11.5px;color:var(--side-muted)}
.me > div{flex:1;min-width:0}
.me button{background:none;border:0;color:var(--side-muted);cursor:pointer;padding:6px;border-radius:8px}
.me button:hover{color:#fff;background:var(--side-3)}
.byb{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--side-muted);padding:4px 8px}
.byb img{width:22px;height:22px}
.main{min-width:0;display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:15}
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumbs b{color:var(--ink);font-weight:600}
.mhead-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wrap{padding:26px 28px 48px;max-width:1320px;width:100%}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.phead p{color:var(--muted);margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- KPI y tablas ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi .k{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.kpi .f{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.kpi.hl{background:linear-gradient(135deg,#014a7d,#0b2a4a);border-color:transparent;color:#fff}
.kpi.hl .k,.kpi.hl .f{color:rgba(255,255,255,.78)}
.g2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:16px}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--card-2);white-space:nowrap}
tbody tr:hover td{background:var(--card-2)}
tr.sel td{background:var(--primary-soft)!important}
td small{display:block;color:var(--muted);font-size:12px}
td.ck,th.ck{width:40px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}
input.seats{width:66px;padding:6px;text-align:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip.pend{background:var(--card-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.act{background:var(--primary-soft);color:var(--primary)}
.chip.sent{background:#eef0ff;color:#3b3f9e}
[data-theme=dark] .chip.sent{background:#1d2048;color:#a5b4fc}
.chip.part{background:var(--warn-bg);color:var(--warn-ink)}
.chip.full{background:var(--good-bg);color:var(--good-ink)}
.chip.in{background:#0b2a4a;color:#bfe1ff}
.bar{position:relative;height:9px;background:var(--card-2);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:110px;flex:1}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--primary);border-radius:6px}
.empty{color:var(--muted);text-align:center;padding:30px 12px}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:15px}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:12px;margin-bottom:12px;align-items:center}
.filters input[type=search]{flex:1;min-width:220px}
.filters select{width:auto;min-width:170px}
.bulk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(90deg,#014a7d,#0b2a4a);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;position:sticky;top:66px;z-index:10;box-shadow:0 8px 20px rgba(1,74,125,.25)}
.bulk select,.bulk input{width:auto;background:#fff;color:#0f172a;padding:6px 8px;border:0}
.bulk input{width:62px}
.bulk .btn{padding:6px 11px;font-size:12.5px}
.bulk .link{color:#fff}
.bulk .sep{width:1px;height:24px;background:rgba(255,255,255,.25)}
.bulk label{display:flex;align-items:center;gap:6px;font-size:12.5px}
.ract{display:flex;gap:2px;justify-content:flex-end}
.ib{width:32px;height:32px;display:grid;place-items:center;border:0;background:none;border-radius:8px;color:var(--ink-2);cursor:pointer;text-decoration:none}
.ib:hover{background:var(--card-2);color:var(--primary)}

/* ---------- Panorama ---------- */
.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.camp{display:flex;gap:16px;padding:16px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);color:var(--ink);width:100%}
.camp:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(15,23,42,.12)}
.camp canvas{width:104px;height:130px;border-radius:10px;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.camp .cb{flex:1;min-width:0;display:grid;gap:7px;align-content:start}
.camp h3{font-size:16px;line-height:1.25}
.camp .meta{font-size:12.5px;color:var(--muted)}
.camp .ms{display:flex;gap:14px;font-size:12px;color:var(--ink-2)}
.camp .ms b{display:block;font-size:16px;color:var(--ink)}
.camp.new{align-items:center;justify-content:center;flex-direction:column;border-style:dashed;color:var(--primary);font-weight:600;min-height:164px;background:transparent;box-shadow:none}
.camp.new span{width:40px;height:40px;border-radius:50%;background:var(--primary-soft);display:grid;place-items:center;font-size:22px}

/* ---------- Estudio de diseño ---------- */
.studio{display:grid;grid-template-columns:400px 1fr;gap:18px;align-items:start}
.tabs{display:flex;gap:4px;padding:6px;background:var(--card-2);border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0}
.tabs button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button.on{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}
.tabs svg.i{width:15px;height:15px}
.tbody{padding:18px;display:grid;gap:14px}
.tbody h3{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tpl{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--card);cursor:pointer;text-align:left;color:var(--ink)}
.tpl canvas{width:100%;aspect-ratio:4/5;height:auto;border-radius:8px;display:block}
.tpl b{display:block;font-size:13px;margin-top:7px}
.tpl small{display:block;font-size:11.5px;color:var(--muted)}
.tpl.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:1px solid var(--line-2);border-radius:11px;padding:9px 6px;cursor:pointer;text-align:center;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--card)}
.opt.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft);color:var(--primary)}
.opt svg{display:block;margin:0 auto 6px}
.opt .aa{display:block;font-size:24px;line-height:1.1;margin-bottom:3px;color:var(--ink)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line-2);cursor:pointer}
.swatches button.on{box-shadow:0 0 0 2px var(--primary)}
.swatches input[type=color]{width:36px;height:36px;padding:2px;border-radius:50%;cursor:pointer}
.upl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.upl .th{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card-2) center/cover no-repeat;flex:none}
.upl .th.logo{background-size:contain;background-color:#fff}
.ai-box{background:linear-gradient(135deg,rgba(29,111,176,.08),rgba(238,64,53,.06));border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line-2);background:var(--card);border-radius:99px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2);font-weight:600}
.chips button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.sug{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;background:var(--card)}
.sug .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sug b{font-size:14px}
.sug p{font-size:12.5px;color:var(--ink-2)}
.sug .dotc{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:6px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.stage-wrap{display:grid;gap:14px;justify-items:center;position:sticky;top:84px}
.segbar{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.segbar button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer}
.segbar button.on{background:var(--primary);color:#fff}
.stage{width:100%;min-height:560px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,var(--card),var(--card-2));border:1px solid var(--line);border-radius:18px;padding:24px}
.stage canvas{width:100%;max-width:440px;height:auto;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.stage-acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--ink-2)}
.stage-acts select{width:auto}
.saved{font-size:12.5px;color:var(--good-ink);display:inline-flex;align-items:center;gap:6px}
.phone{width:320px;height:640px;border-radius:44px;background:#0b0f17;padding:12px;box-shadow:0 24px 60px rgba(0,0,0,.35),inset 0 0 0 2px #2a3242;position:relative}
.phone::before{content:"";position:absolute;top:18px;left:50%;transform:translateX(-50%);width:90px;height:22px;border-radius:12px;background:#000;z-index:3}
.phone-scr{width:100%;height:100%;border-radius:34px;overflow:hidden auto;background:#fff;position:relative}
.phone-scr .rp{min-height:100%}

/* ---------- Página del invitado ---------- */
body.public{background:#0b0f17}
.rp{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--rp-bg);color:var(--rp-ink)}
.rp.r-light{--rp-bg:#ffffff;--rp-ink:#111827;--rp-ink2:#4b5563;--rp-card:#f3f4f6;--rp-line:#e5e7eb}
.rp.r-dark{--rp-bg:#0e131c;--rp-ink:#f3f4f6;--rp-ink2:#aab4c3;--rp-card:#18202d;--rp-line:#263042}
.rp-demo{background:#fff7e0;color:#6b4e00;font-size:12px;text-align:center;padding:7px 12px}

function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const delim = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim){ row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

async function downloadZip(c, list){

function dayChart(c){
  const times = c.guests.flatMap(g => g.redemptions.map(r => +new Date(r.at)));
  if (!times.length) return '<div class="empty"><b>Sin confirmaciones todavía</b></div>';
  let end = new Date(); end.setHours(0, 0, 0, 0);
  const last = new Date(Math.max(...times)); last.setHours(0, 0, 0, 0);
  if (end - last > 13 * 864e5) end = last;
  const days = 14, keys = [...Array(days)].map((_, i) => { const d = new Date(end); d.setDate(d.getDate() - (days - 1 - i)); return d; });
  const counts = keys.map(d => times.filter(t => { const x = new Date(t); x.setHours(0, 0, 0, 0); return x.getTime() === d.getTime(); }).length);
  const W = 640, H = 220, L = 34, B = 26, T = 10, pw = W - L - 8, ph = H - T - B, max = Math.max(4, ...counts), step = Math.ceil(max / 4), top = step * 4, gw = pw / days, bw = Math.min(26, gw - 8);
  let s = '';
  for (let i = 0; i <= 4; i++){ const y = T + ph - ph * i / 4; s += `<line x1="${L}" x2="${W - 8}" y1="${y}" y2="${y}" class="${i ? 'grid' : 'base'}"/><text x="${L - 8}" y="${y + 4}" class="tick" text-anchor="end">${step * i}</text>`; }
  keys.forEach((d, i) => {
    const v = counts[i], h = ph * v / top, x = L + gw * i + (gw - bw) / 2, lbl = d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }), r = Math.min(4, h);
    s += `<g class="col" data-tip="${esc(lbl + '|' + plural(v, 'confirmación', 'confirmaciones'))}"><rect class="hit" x="${L + gw * i}" y="${T}" width="${gw}" height="${ph}" rx="4"/>${v ? `<path d="M${x},${T + ph}V${T + ph - h + r}Q${x},${T + ph - h} ${x + r},${T + ph - h}H${x + bw - r}Q${x + bw},${T + ph - h} ${x + bw},${T + ph - h + r}V${T + ph}Z" fill="var(--primary)"/>` : ''}${i % 2 === 1 ? `<text x="${L + gw * i + gw / 2}" y="${H - 8}" class="tick" text-anchor="middle">${d.getDate()} ${d.toLocaleDateString('es-MX', { month: 'short' }).replace('.', '')}</text>` : ''}</g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Confirmaciones por día">${s}</svg>`;
}

function lxHandle(text){
  const m = /#\/r\/([A-Za-z0-9]{8})/.exec(text) || /^\s*([A-Za-z0-9]{4})-?([A-Za-z0-9]{4})\s*$/.exec(text);

  let st;
  if (!hit) st = 'invalid';
  else if (!c || hit.c.id !== c.id) st = 'other';
  else if (entered(hit.g) >= hit.g.seats) st = 'used';
  else if (used(hit.g) === 0) st = 'unconf';
  else st = 'valid';
  LX.cur = { st, code, hit };
  const g = hit && hit.g;
  LX.n = g ? Math.max(1, Math.min(g.seats - entered(g), Math.max(1, used(g) - entered(g)))) : 1;
  openSheet();
}
const SHEET = {

  }
  const sh = $('#sheet'); sh.style.setProperty('--st', k.color);
  sh.innerHTML = `<div class="stt"><span class="ic">${k.icon}</span><div><b>${k.title}</b><span>${k.sub}</span></div></div>${body}`;
  $('#sheetBack').hidden = false;
  LX.log.unshift({ at: new Date().toISOString(), color: k.color, title: g ? g.name : k.title, sub: g ? k.title : (code ? fmtCode(code) : 'Lectura fallida') });
  lxRefresh();
}
function closeSheet(){ $('#sheetBack').hidden = true; $('#sheet').innerHTML = ''; LX.cur = null; }
async function camOn(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast('Este navegador no permite usar la cámara aquí. Usa "Simular lectura".', true);
  try {
    camOff();
    LX.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    const v = $('#lxVideo'); if (!v) return camOff();
    v.srcObject = LX.stream; v.hidden = false; await v.play(); $('#lxOff').hidden = true;
    const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
    LX.timer = setInterval(() => {
      const vid = $('#lxVideo'); if (!vid){ camOff(); return; } if (!vid.videoWidth || !$('#sheetBack').hidden) return;
      const w = 480, h = Math.round(vid.videoHeight * w / vid.videoWidth); cv.width = w; cv.height = h; ctx.drawImage(vid, 0, 0, w, h);
      const res = window.jsQR && jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
      if (res && res.data && (res.data !== LX.lastText || Date.now() - LX.lastAt > 4000)){ LX.lastText = res.data; LX.lastAt = Date.now(); if (navigator.vibrate) navigator.vibrate(60); lxHandle(res.data); }
    }, 250);
  } catch (e){ toast('No se pudo abrir la cámara. Revisa el permiso o usa "Simular lectura".', true); }
}
function camOff(){ clearInterval(LX.timer); LX.timer = null; if (LX.stream){ LX.stream.getTracks().forEach(t => t.stop()); LX.stream = null; } }
function simScan(){
  const c = lxCamp(); if (!c) return toast('No hay campañas activas para leer.', true);
  const G = c.guests.filter(g => g.code), pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const want = ['valid', 'valid', 'unconf', 'used', 'invalid'][LX.i++ % 5];
  const pools = { valid: G.filter(g => used(g) > 0 && entered(g) < g.seats), unconf: G.filter(g => used(g) === 0 && entered(g) < g.seats), used: G.filter(g => entered(g) >= g.seats) };
  let g = pools[want] && pools[want].length ? pick(pools[want]) : null;
  if (!g && want !== 'invalid') g = pools.valid.length ? pick(pools.valid) : pools.unconf.length ? pick(pools.unconf) : null;
  if (!g){ let fake; do { fake = [...Array(8)].map(() => ALPH[Math.floor(Math.random() * ALPH.length)]).join(''); } while (findGuest(fake)); return lxHandle(redeemUrl(fake)); }
  lxHandle(redeemUrl(g.code));
}

function readImage(file, maxDim, keepPng){
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, maxDim / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      res(keepPng ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', .86));
    }; img.onerror = () => rej(new Error('No se pudo leer la imagen')); img.src = rd.result; };
    rd.onerror = () => rej(new Error('No se pudo leer el archivo')); rd.readAsDataURL(file);
  });
}

  const people = [['Ana Lucía Torres', 'Grupo Andino', 'Patrocinadores', 4], ['Bernardo Ríos', 'Logística Alfa', 'Patrocinadores', 4], ['Isabel Cortés', 'Inmobiliaria Brisa', 'Clientes VIP', 2], ['Jorge Navarro', 'Farmacias Delta', 'Clientes VIP', 2], ['Karla Benítez', 'Autos del Bajío', 'Clientes VIP', 2], ['Valeria Robles', 'Revista Cancha', 'Medios', 1], ['Andrés Quiroga', 'Radio Pulso', 'Medios', 1], ['Hilda Cárdenas', 'Producción', 'Staff', 1]];
  return people.map(([name, company, group, seats]) => { const p = norm(name).split(' '); return { id: uid(), name, email: p[0] + '.' + p[p.length - 1] + '@ejemplo.com', company, group, extra1: '', extra2: '', seats, code: null, activatedAt: null, sentAt: null, redemptions: [], checkins: [] }; });

let dzT = null;
const ACTIONS = {

  demoOnly(){ UI.menu = null; render(); toast('En la demo las organizaciones vienen precargadas.'); },
  pickCamp: d => { S.campaignId = d.id; UI.menu = null; UI.sel.clear(); UI.pv = ''; save(); render(); },

  goCamp: d => { S.campaignId = d.id; save(); },
  newCamp(){ UI.menu = null; UI.newTpl = 'gala'; openModal(newCampHtml(), true); },
  pickTpl: d => { UI.newTpl = d.k; $$('.tplpick button').forEach(b => b.classList.toggle('on', b.dataset.k === d.k)); },
  reset(){ if (!confirm('Se restauran los datos de ejemplo de la demo. ¿Continuar?')) return; S = seedState(); UI.sel.clear(); UI.q = UI.group = UI.status = ''; UI.ai = null; LX.log = []; save(); go('#/app/panorama'); toast('Demo restaurada'); },
  tab: d => { UI.tab = d.k; render(); },
  stage: d => { UI.stage = d.k; render(); },
  tpl: d => { const c = camp(); c.design = applyTpl(c.design, d.k); save(); render(); toast('Plantilla ' + TPL[d.k].name + ' aplicada'); },
  dset: d => { camp().design[d.f] = d.v; save(); render(); },
  pickImg: d => pickFile('image/*', async file => {
    try { const c = camp(), url = await readImage(file, d.kind === 'logo' ? 700 : 1600, d.kind === 'logo'), prev = c.design[d.kind]; c.design[d.kind] = url; if (!save()){ c.design[d.kind] = prev; return; } render(); toast(d.kind === 'logo' ? 'Logo listo' : 'Fondo listo'); }
    catch (e){ toast(e.message, true); }
  }),
  clearImg: d => { camp().design[d.kind] = null; save(); render(); },
  aiTone: d => { UI.aiTone = d.k; render(); },
  aiGo(){ UI.aiBusy = true; UI.ai = null; render(); setTimeout(() => { UI.aiBusy = false; UI.ai = aiSuggest(); render(); }, 900); },
  aiUse: d => { const s = UI.ai[+d.i], c = camp(); c.design = applyTpl(Object.assign({}, c.design, { host: s.host, message: s.message, name: s.name }), s.tpl); save(); render(); toast('Propuesta aplicada. Puedes seguir ajustándola.'); },
  async dlSample(){ const c = camp(), g = c.guests.find(x => x.id === UI.pv && x.code) || c.guests.find(x => x.code); if (!g) return; await downloadOne(c, g); render(); toast('Muestra descargada'); },
  pickCsv(){ pickFile('.csv,text/csv', file => { const rd = new FileReader(); rd.onload = () => importCSV(String(rd.result)); rd.readAsText(file, 'utf-8'); }); },
  template(){ downloadBlob(new Blob(['﻿nombre,correo,empresa,grupo,lugares,campo1,campo2\nAna López,ana.lopez@ejemplo.com,Empresa Uno,Clientes VIP,2,,\nLuis Pérez,luis.perez@ejemplo.com,Empresa Dos,Medios,1,,\n'], { type: 'text/csv' }), 'plantilla_invitados.csv'); },
  sampleGuests(){ camp().guests.push(...sampleList()); save(); render(); toast('Lista de ejemplo cargada'); },
  clearSel(){ UI.sel.clear(); render(); },
  applySeats(){ const v = Math.min(20, Math.max(1, parseInt($('#bulkSeats').value, 10) || 1)); let skip = 0; selected().forEach(g => { if (Math.max(used(g), entered(g)) > v) skip++; else g.seats = v; }); save(); render(); toast('Lugares actualizados' + (skip ? '. ' + plural(skip, 'pase no cambió', 'pases no cambiaron') + ' porque ya tenía más confirmados' : '')); },
  activate(){ activate(selected()); },
  activateOne: d => activate(camp().guests.filter(g => g.id === d.id)),
  markSent(){ const now = new Date().toISOString(), act = selected().filter(g => g.code); act.forEach(g => { if (!g.sentAt) g.sentAt = now; }); save(); render(); toast(act.length ? plural(act.length, 'invitación marcada', 'invitaciones marcadas') + ' como enviada' + (act.length > 1 ? 's' : '') : 'Primero activa los pases', !act.length); },
  dlSel(){ downloadZip(camp(), selected()); },
  dlAll(){ downloadZip(camp(), camp().guests.filter(g => g.code)); },
  card: d => openCard(d.id),
  async dlCard(d){ const c = camp(), g = c.guests.find(x => x.id === d.id); await downloadOne(c, g); closeModal(); render(); toast('Invitación descargada y marcada como enviada'); },
  async copyLink(d){ const g = camp().guests.find(x => x.id === d.id); try { await navigator.clipboard.writeText(redeemUrl(g.code)); toast('Enlace copiado'); } catch (e){ toast('No se pudo copiar el enlace', true); } },
  closeModal,
  simulate(){
    const c = camp(), pool = c.guests.filter(g => g.code && left(g) > 0);
    if (!pool.length) return toast('Primero activa pases en el paso 2.', true);
    const now = Date.now(), pick = pool.filter(() => Math.random() < .45); if (!pick.length) pick.push(pool[0]);
    pick.forEach(g => {
      if (!g.sentAt) g.sentAt = new Date(now - 4 * 864e5).toISOString();
      const k = 1 + Math.floor(Math.random() * left(g));
      for (let i = 0; i < k; i++) g.redemptions.push({ id: uid(), name: used(g) === 0 ? g.name : COMPANIONS[Math.floor(Math.random() * COMPANIONS.length)], email: '', at: new Date(now - Math.floor(Math.random() * 3 * 864e5)).toISOString() });
    });
    if (c.status === 'borrador') c.status = 'activa';
    save(); render(); toast(plural(pick.length, 'pase confirmó', 'pases confirmaron') + ' en la simulación');
  },
  simIn(){
    const c = camp(), pool = c.guests.filter(g => used(g) > entered(g));
    if (!pool.length) return toast('No hay confirmados pendientes de llegar. Simula confirmaciones primero.', true);
    const pick = pool.filter(() => Math.random() < .5); if (!pick.length) pick.push(pool[0]);
    pick.forEach(g => g.checkins.push({ id: uid(), n: used(g) - entered(g), at: new Date().toISOString(), gate: Math.random() < .5 ? 'Puerta A' : 'Puerta B' }));
    save(); render(); toast(plural(pick.length, 'pase llegó', 'pases llegaron') + ' en la simulación');
  },
  export(){
    const c = camp(), q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [['Nombre', 'Correo', 'Empresa', 'Grupo', 'Lugares', 'Código', 'Estado', 'Confirmados', 'Nombres confirmados', 'Llegaron', 'Campo 1', 'Campo 2'].map(q).join(',')]
      .concat(c.guests.map(g => [g.name, g.email, g.company, g.group, g.seats, fmtCode(g.code), status(g).label, used(g), g.redemptions.map(r => r.name).join(' | '), entered(g), g.extra1, g.extra2].map(q).join(',')));
    downloadBlob(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv' }), c.code + '_confirmaciones.csv');
  },
  async remindCopy(){
    const c = camp(), d = c.design, msg = `Hola, te recordamos tu invitación a ${d.name}${d.date ? ', el ' + d.date : ''}. ¿Nos confirmas tu asistencia${d.deadline ? ' antes del ' + d.deadline : ''}? Usa el enlace de tu invitación. ¡Te esperamos!`;
    try { await navigator.clipboard.writeText(msg); toast('Mensaje de recordatorio copiado'); } catch (e){ toast('No se pudo copiar el mensaje', true); }
  },
  remindList(){
    const c = camp(), q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"', P = c.guests.filter(g => isSentLike(g) && used(g) === 0);
    downloadBlob(new Blob(['﻿' + [['Nombre', 'Correo', 'Empresa', 'Grupo', 'Enlace'].map(q).join(',')].concat(P.map(g => [g.name, g.email, g.company, g.group, redeemUrl(g.code)].map(q).join(','))).join('\n')], { type: 'text/csv' }), c.code + '_pendientes.csv');
  },
  seePend(){ UI.status = 'sent'; UI.group = ''; UI.q = ''; go('#/app/invitados'); },
  invite(){ openModal(`<h2 style="font-size:18px">Invitar usuario</h2><form class="form" data-form="invite"><label class="f">Nombre<input name="n" required maxlength="60"></label><label class="f">Correo<input name="e" type="email" required maxlength="120"></label><label class="f">Rol<select name="r"><option value="admin">Administrador</option><option value="lector">Lector de acceso</option><option value="viewer">Solo métricas</option></select></label><label class="f">Puerta <span class="h">solo para lectores</span><input name="g" maxlength="30" placeholder="Ej. Puerta C"></label><div class="form-acts"><button type="button" class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn primary">Enviar invitación</button></div></form>`, true); },
  ics: d => {
    const hit = findGuest(d.code); if (!hit) return; const de = hit.c.design;
    const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Atrio//ES', 'BEGIN:VEVENT', 'UID:' + d.code + '@atrio', 'SUMMARY:' + de.name, 'LOCATION:' + de.place, 'DESCRIPTION:' + [de.date, de.time, de.dress && 'Vestimenta: ' + de.dress].filter(Boolean).join(' · '), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    downloadBlob(new Blob([body], { type: 'text/calendar' }), norm(de.name).replace(/[^a-z0-9]+/g, '_') + '.ics');
  },
  async share(d){
    const hit = findGuest(d.code), url = redeemUrl(d.code), data = { title: hit ? hit.c.design.name : 'Invitación', text: 'Te comparto la invitación. Confirma tu lugar aquí:', url };
    try { if (navigator.share){ await navigator.share(data); return; } await navigator.clipboard.writeText(url); toast('Enlace copiado. Pégalo en WhatsApp para compartirlo.'); }
    catch (e){ if (e && e.name !== 'AbortError') toast('Copia el enlace de esta página para compartirla.'); }
  },
  camOn, simScan,
  typeCode(){ const v = prompt('Escribe el código de la invitación (8 caracteres)'); if (v) lxHandle(v); },
  sheetClose: closeSheet,
  lxMinus(){ LX.n = Math.max(1, LX.n - 1); const e = $('#lxN'); if (e) e.textContent = LX.n; },
  lxPlus(){ const g = LX.cur && LX.cur.hit && LX.cur.hit.g; if (!g) return; LX.n = Math.min(g.seats - entered(g), LX.n + 1); const e = $('#lxN'); if (e) e.textContent = LX.n; },
  lxIn(){
    const cur = LX.cur; if (!cur || !cur.hit) return closeSheet();
    S = load(); const hit = findGuest(cur.code); if (!hit) return closeSheet();
    const g = hit.g, n = Math.min(LX.n, g.seats - entered(g)); if (n <= 0){ closeSheet(); return toast('Este pase ya no tiene lugares', true); }
    g.checkins.push({ id: uid(), n, at: new Date().toISOString(), gate: LX.gate }); save();
    LX.log[0] = { at: new Date().toISOString(), color: '#22c55e', title: g.name, sub: 'Entraron ' + plural(n, 'persona', 'personas') };
    closeSheet(); lxRefresh(); toast('Entrada registrada: ' + plural(n, 'persona', 'personas'));
  }
};
function newCampHtml(){
  return `<h2 style="font-size:18px">Nueva campaña</h2><p class="help" style="margin:-6px 0 14px">Una campaña es una invitación con su propia lista, su código y sus métricas.</p>
  <form class="form" data-form="newCamp"><label class="f">Nombre<input name="n" required maxlength="60" placeholder="Ej. Cena de Patrocinadores"></label>
    <label class="f">Fecha <span class="h">opcional</span><input name="d" maxlength="40" placeholder="Ej. Jueves 3 de diciembre"></label>
    <div><div class="help" style="font-weight:600;margin-bottom:8px">Plantilla inicial</div><div class="tplpick">${Object.entries(TPL).map(([k, t]) => `<button type="button" class="${UI.newTpl === k ? 'on' : ''}" data-act="pickTpl" data-k="${k}"><div class="sw2" style="background:${CSSBG[t.bg]};border-bottom:4px solid ${t.accent}"></div><span>${t.name}</span></button>`).join('')}</div></div>
    <div class="form-acts"><button type="button" class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn primary">Crear y diseñar</button></div></form>`;
}
async function openCard(id){
  const c = camp(), g = c.guests.find(x => x.id === id); if (!g) return;
  const st = status(g);
  openModal(`<button class="x" data-act="closeModal" aria-label="Cerrar">&times;</button><div class="card-modal">
    <div><canvas id="cardCv" width="1080" height="1350"></canvas></div>
    <div class="side2"><h2 style="font-size:19px;margin:0">${esc(g.name)}</h2><p class="help">${esc(g.company)}${g.group ? ' · ' + esc(g.group) : ''}</p>
      <div class="codebox mono">${fmtCode(g.code)}</div>
      <p class="help">${g.seats > 1 ? 'Pase para ' + g.seats + ' personas' : 'Pase individual'} · <span class="chip ${st.k}">${st.label}</span></p>
      <div class="urlbox">${esc(redeemUrl(g.code))}</div>
      <button class="btn primary" data-act="dlCard" data-id="${g.id}">${ico('down')}Descargar imagen</button>
      <div class="acts"><a class="btn" style="flex:1" href="${waLink(c, g)}" target="_blank" rel="noopener">${ico('chat')}WhatsApp</a><button class="btn" style="flex:1" data-act="copyLink" data-id="${g.id}">${ico('link')}Copiar enlace</button></div>
      <a class="btn" href="#/r/${g.code}" target="_blank" rel="noopener">${ico('eye')}Abrir página del invitado</a>
      <p class="help" style="font-size:12px">WhatsApp abre el mensaje con el enlace; la imagen se adjunta a mano. En la demo, confirma en la página del invitado y este panel se actualiza solo.</p></div></div>`);
  await drawInvitation($('#cardCv'), g, c.design);
}
function openModal(html, small){ const m = $('#modal'); m.className = 'modal' + (small ? ' sm' : ''); m.innerHTML = html; $('#modalBack').hidden = false; const f = m.querySelector('input:not([type=hidden])'); if (f) setTimeout(() => f.focus(), 30); }
function closeModal(){ $('#modalBack').hidden = true; $('#modal').innerHTML = ''; }

const CHANGES = {
  fgroup: el => { UI.group = el.value; render(); },
  fstatus: el => { UI.status = el.value; render(); },
  sel: el => { el.checked ? UI.sel.add(el.dataset.id) : UI.sel.delete(el.dataset.id); render(); },
  selAll: el => { filtered(camp()).forEach(g => el.checked ? UI.sel.add(g.id) : UI.sel.delete(g.id)); render(); },
  seats: el => { const g = camp().guests.find(x => x.id === el.dataset.id); g.seats = Math.min(20, Math.max(used(g) || 1, entered(g) || 1, parseInt(el.value, 10) || 1)); save(); render(); },
  bulkGroup: el => {
    let v = el.value; if (!v) return;
    if (v === '__new'){ v = (prompt('Nombre del nuevo grupo') || '').trim(); if (!v){ render(); return; } }
    const list = selected(); list.forEach(g => { g.group = v; }); save(); render(); toast(plural(list.length, 'invitado', 'invitados') + ' en el grupo "' + v + '"');
  },
  pv: el => { UI.pv = el.value; render(); },
  accentPick: el => { camp().design.accent = el.value; save(); render(); },
  lxCamp: el => { S.campaignId = el.value; save(); LX.log = []; render(); }
};
const FORMS = {
  login(f){
    const u = f.elements.u.value.trim(), p = f.elements.p.value;
    const role = u === 'admin' && p === 'demo2026' ? 'admin' : u === 'lector' && p === 'puerta2026' ? 'lector' : null;
    if (!role) return toast('Usuario o contraseña incorrectos', true);
    lsSet(SKEY, JSON.stringify({ role, at: Date.now() }));
    go(role === 'admin' ? '#/app/panorama' : '#/lector');
  },
  findCode(f){ location.hash = '#/r/' + f.elements.c.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase(); },
  redeem(f){
    S = load(); const hit = findGuest(f.dataset.code); if (!hit) return;
    const g = hit.g, name = f.elements.n.value.trim().replace(/\s+/g, ' ');
    if (!name) return toast('Escribe el nombre de quien asiste', true);
    if (left(g) <= 0){ render(); return toast('Este pase ya no tiene lugares disponibles', true); }
    if (g.redemptions.some(r => norm(r.name) === norm(name))) return toast(name + ' ya está confirmado en este pase', true);
    g.redemptions.push({ id: uid(), name, email: f.elements.e.value.trim(), at: new Date().toISOString() });
    if (!g.sentAt) g.sentAt = g.activatedAt || new Date().toISOString();
    save(); R.flash = first(name); render(); window.scrollTo(0, 0);
  },
  newCamp(f){
    const name = f.elements.n.value.trim(); if (!name) return;
    const c = { id: uid(), tenantId: tenant().id, code: campCode(name), name, status: 'borrador', createdAt: new Date().toISOString(), guests: [],
      design: designFrom(UI.newTpl || 'gala', { host: tenant().name + ' te invita a', name, date: f.elements.d.value.trim() }) };
    S.campaigns.push(c); S.campaignId = c.id; UI.tab = 'contenido'; UI.sel.clear(); save(); closeModal(); go('#/app/estudio'); toast('Campaña creada con el código ' + c.code);
  },
  invite(f){
    const t = tenant(); (S.team[t.id] = S.team[t.id] || []).push({ id: uid(), name: f.elements.n.value.trim(), email: f.elements.e.value.trim(), role: f.elements.r.value, gate: f.elements.g.value.trim() });
    save(); closeModal(); render(); toast('Invitación enviada (demo)');
  }
};

/* =================== Eventos =================== */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.dz){
    const c = camp(); c.design[t.dataset.dz] = t.value; const s = $('#saved'); if (s) s.textContent = 'Guardando…';
    clearTimeout(dzT); dzT = setTimeout(() => { save(); const s2 = $('#saved'); if (s2) s2.textContent = '✓ Guardado'; }, 400);
    const pv = $('#pv'); if (pv) drawInvitation(pv, previewGuest(c), c.design);
    const ps = $('.phone-scr'); if (ps) ps.innerHTML = redeemInner(c, previewGuest(c), true);
    return;
  }
  if (t.dataset.input === 'q'){ UI.q = t.value; const pos = t.selectionStart; render(); const n = $('[data-input=q]'); if (n){ n.focus(); n.setSelectionRange(pos, pos); } return; }
  if (t.dataset.input === 'aiText') UI.aiText = t.value;
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (UI.menu && !e.target.closest('.drop')){ UI.menu = null; render(); if (!t) return; }
  if (!t) return;
  const fn = ACTIONS[t.dataset.act]; if (!fn) return;
  if (t.tagName === 'A' && t.dataset.act === 'goCamp'){ fn(t.dataset, t); return; }
  e.preventDefault(); fn(t.dataset, t);
});
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t && CHANGES[t.dataset.chg]) CHANGES[t.dataset.chg](t); });
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form](f); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#sheetBack').hidden) closeSheet(); else if (!$('#modalBack').hidden) closeModal(); else if (UI.menu){ UI.menu = null; render(); }
});
$('#modalBack').addEventListener('mousedown', e => { if (e.target.id === 'modalBack') closeModal(); });
$('#sheetBack').addEventListener('mousedown', e => { if (e.target.id === 'sheetBack') closeSheet(); });
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t){ tip.hidden = true; return; }
  const parts = t.dataset.tip.split('|');
  tip.innerHTML = `<b>${esc(parts[0])}</b>` + parts.slice(1).map(p => `<div>${esc(p)}</div>`).join('');
  tip.hidden = false;
  const r = tip.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14; if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
let toastT;
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, err ? 4200 : 2800); }

/* =================== Arranque =================== */
setTheme(lsGet(TKEY, null) || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
if (!lsGet(KEY, null)) save();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
  fontsP = null;
  const h = route();
  if (!session()) drawLoginArt();
  else if (h.startsWith('/app/') || h === '/') afterRender(Object.keys(VIEWS).find(k => h === '/app/' + k) || 'panorama');
});
})();
